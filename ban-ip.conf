# ban-ip.conf -- ban-ip.sh の設定ファイル
# 設置: /etc/ban-ip.conf
# 書式: シェル変数そのまま (ban-ip.sh が読み込む)
# パスを変えたくなったら、スクリプト本体ではなくここだけ直す

# 巡回するApacheアクセスログ (サンプル値。自分の環境のパスに書き換えること)
LOG=/var/log/apache2/access.log

# キーワード定義ファイル
CONF=/etc/ban-keywords.conf

# banした記録を残すログ
BANLOG=/var/log/ban-ip.log

# 使うファイアウォール: 使う方を有効にし、もう一方を # でコメントアウト
FW=ufw
#FW=iptables
# iptables の注意: ルールは再起動で消える。残したい場合は
# iptables-persistent を入れ、ban-ip.sh 内の
# 「netfilter-persistent save」の行の # を外すこと
