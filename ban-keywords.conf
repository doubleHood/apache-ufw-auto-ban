# ban-keywords.conf -- ban対象キーワード集 (サンプル)
# 書式: 1行に1つ。ログ行全体に対して文字列のまま照合される (grep -F)
#       # で始まる行と空行はスクリプト側で除去される (= 無効化は行頭に # を付けるだけ)
#
# ★使う前に必ずやること
#   自分のサイト/アプリの正規パスと衝突しないか確認する。
#   ログイン画面、管理画面、APIなどが同じ文字列を含むなら、その行を消すか
#   # で無効化すること。特に:
#   - WordPress運用中なら「任意」節の wp- 関連は絶対に有効化しない
#   - Next.js運用中なら _next/ は POST 付きの形 (本ファイルの形) のままにする
#   - 独自アプリに /login や /admin があるなら、それらを有効化しない

# ==== 有効: 秘情報・設定ファイル探索 ====
# どの技術スタックでも正規リクエストにまず現れないもの
.env
.git
.svn
.aws
.docker
.bak
.sql
backup.
etc/passwd
%2e%2e
..%2f

# ==== 有効: スキャナーの定型シグネチャ ====
# Next.js / React Server Components 探索。実在のNext.jsサイトでも
# 正規の /_next/ アクセスはGETのアセット取得のみで、POSTは探索だけ
POST /_next/
_react/
staging-login
sigin

# ==== 有効: よくある脆弱性探索パス ====
phpmyadmin
xmlrpc
cgi-bin/
boaform
HNAP1
/administrator/
geoserver/
solr/
actuator/
manager/html
owa/
autodiscover
developmentserver
cdn-cgi/
/mcp
vendor/phpunit
/thinkphp/
containers/json
server-status

# ==== 任意: 使っていない技術スタックなら # を外して有効化 ====
# .php
# .aspx
# /wp-
# /wordpress/

# ==== 任意: 自分のサイトに該当ルートが無い場合のみ有効化 ====
# ログイン/管理画面系は正規ルートと衝突しやすいので慎重に。
# 有効化すると、その画面を正規に開いた人 (自分を含む) がbanされる
# /login
# /sign-in
# /signin
# /auth/
# POST /account
# POST /dashboard
# POST /home
# POST /apps
# POST /api

# ==== 入れてはいけないもの (メモ) ====
# favicon.ico / robots.txt / sitemap.xml / .well-known/
#   → 通常のブラウザや検索エンジンが普通に叩くパス。サイト側で
#     それらが404を返す場合、入れると普通の訪問者がbanされる
